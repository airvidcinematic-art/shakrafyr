[package]
name = "convert432"
version = "0.1.0"
description = "Convert432 — concert pitch and Solfeggio retune jukebox"
authors = ["iHeal Collective"]
edition = "2021"

[lib]
name = "convert432_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
